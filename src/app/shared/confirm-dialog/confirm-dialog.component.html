@if (confirmService.request(); as req) {
  <div class="confirm-backdrop" (click)="confirmService.respond(false)">
    <div
      class="confirm-box"
      role="alertdialog"
      aria-modal="true"
      aria-label="Confirm"
      (click)="$event.stopPropagation()"
    >
      <p class="confirm-message">{{ req.message }}</p>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" (click)="confirmService.respond(false)">
          {{ req.cancelLabel }}
        </button>
        <button type="button" class="confirm-danger" (click)="confirmService.respond(true)">
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
